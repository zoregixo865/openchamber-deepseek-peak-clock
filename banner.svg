<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="DeepSeek Clock — peak and off-peak billing for OpenChamber">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1013"/>
      <stop offset="1" stop-color="#1b1f27"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="off" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="25" fill="none" stroke="#2b303a" stroke-width="2"/>

  <circle cx="74" cy="92" r="20" fill="url(#dot)"/>
  <circle cx="74" cy="92" r="9" fill="#0e1013"/>

  <text x="112" y="86" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="58" font-weight="700" fill="#f4f4f5">DeepSeek Clock</text>
  <text x="114" y="126" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" fill="#9ca3af">Peak / Off-Peak billing, live in the OpenChamber sidebar</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
    <rect x="114" y="158" width="182" height="36" rx="18" fill="#10b981" fill-opacity="0.16"/>
    <text x="137" y="182" fill="#6ee7b7">OFF-PEAK</text>

    <rect x="310" y="158" width="150" height="36" rx="18" fill="#ef4444" fill-opacity="0.16"/>
    <text x="333" y="182" fill="#fca5a5">PEAK</text>

    <rect x="474" y="158" width="196" height="36" rx="18" fill="#8b7ec8" fill-opacity="0.16"/>
    <text x="497" y="182" fill="#c4b5fd">NO PERMISSIONS</text>
  </g>

  <rect x="56" y="224" width="1088" height="24" rx="12" fill="#262b34"/>
  <rect x="56" y="224" width="272" height="24" rx="12" fill="url(#off)"/>
  <rect x="328" y="224" width="150" height="24" fill="url(#peak)"/>
  <rect x="478" y="224" width="188" height="24" fill="url(#off)"/>
  <rect x="666" y="224" width="150" height="24" fill="url(#peak)"/>
  <rect x="816" y="224" width="328" height="24" rx="12" fill="url(#off)"/>
  <rect x="352" y="216" width="4" height="40" rx="2" fill="#f4f4f5"/>
</svg>
